<?xml version="1.0" encoding="UTF-8"?>
<!-- The hammer, which is the site's brand mark. Flat shapes and no gradients,
     so it stays legible at the 16px a file manager draws it at. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#161a23"/>
  <g transform="rotate(-35 32 32)">
    <!-- handle -->
    <rect x="29" y="26" width="6" height="27" rx="3" fill="#c98a3f"/>
    <!-- head -->
    <rect x="16" y="12" width="32" height="15" rx="3" fill="#ffb454"/>
    <!-- claw side, cut in as a notch rather than drawn, so it reads small -->
    <path d="M16 12 h7 v15 h-7 a3 3 0 0 1 -3 -3 v-9 a3 3 0 0 1 3 -3 z" fill="#ffc57a"/>
  </g>
</svg>
